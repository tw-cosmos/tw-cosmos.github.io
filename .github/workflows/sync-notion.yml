name: Sync Notion to taipei-garden

# Every day 09:30 Taipei time (01:30 UTC).
# Can also be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fails the job (and leaves data/ untouched) on API error or when no
      # row passes the verification gate.
      - name: Generate YAML from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py

      - name: Build pages
        run: python scripts/build.py

      - name: Commit when something changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/taipei-garden.yml taipei-garden/index.html
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          today=$(TZ=Asia/Taipei date +%Y-%m-%d)
          git commit -m "sync: notion ${today}"
          git push
