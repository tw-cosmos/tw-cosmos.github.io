# Pages watched for content changes.
#
# Each entry produces one snapshot file at snapshots/<key>.txt.
# Add a venue by appending an entry; nothing else needs to change.
#
#   key             file name for the snapshot, lowercase, no spaces
#   label           name shown in the report
#   url             page to read
#   expect_pattern  optional. presence check only: if the page settles
#                   without matching this at all, treat it as a failed
#                   read rather than as "everything was withdrawn"
#   min_lines       guard against reporting a load failure as a content wipe
#
# There is deliberately no expected item count. How many offers are on the
# page is exactly what this check is watching, so it must never be
# configuration that has to be kept in step by hand.

poll_ms: 2000
load_timeout_ms: 45000

sources:
  - key: taipei-garden
    label: 台北花園大酒店 促銷活動頁
    url: https://www.taipeigarden.com.tw/promotions/
    expect_pattern: '[\d,]{3,7}\s*twd'
    min_lines: 10
